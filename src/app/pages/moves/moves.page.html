<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'common.appName' | translate }}</ion-title>
    <ion-buttons slot="end">
      <app-account-button />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p class="section-label">{{ 'moves.yourMoves' | translate }}</p>

  @if (moves().length === 0) {
    <p class="empty">{{ 'moves.empty' | translate }}</p>
  }

  <div class="lista">
    @for (move of moves(); track move.id) {
      <div class="fila">
        <button class="fila-main" type="button" (click)="open(move)">
          <span class="icono"><ion-icon name="cube-outline"></ion-icon></span>
          <span class="info">
            <span class="nombre">{{ move.name }}</span>
            <span class="meta">{{ 'moves.createdOn' | translate }} {{ move.createdAt | date: 'd MMM y' }}</span>
          </span>
        </button>
        <ion-button class="opciones" fill="clear" (click)="openOptions(move)" [attr.aria-label]="'moves.optionsAria' | translate">
          <ion-icon slot="icon-only" name="ellipsis-vertical-outline"></ion-icon>
        </ion-button>
      </div>
    }
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="newMove()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
