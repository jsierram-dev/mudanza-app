<ion-header>
  <ion-toolbar>
    <ion-title>Mudanza</ion-title>
    <ion-buttons slot="end">
      <app-account-button />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p class="section-label">Tus mudanzas</p>

  @if (moves().length === 0) {
    <p class="empty">Todavía no creaste ninguna mudanza.</p>
  }

  <div class="lista">
    @for (move of moves(); track move.id) {
      <button class="fila" type="button" (click)="open(move)">
        <span class="icono"><ion-icon name="cube-outline"></ion-icon></span>
        <span class="info">
          <span class="nombre">{{ move.name }}</span>
          <span class="meta">Creada {{ move.createdAt | date: 'd MMM y' }}</span>
        </span>
      </button>
    }
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="newMove()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
